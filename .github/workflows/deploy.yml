name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/jake/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply k8s manifests
        run: |
          kubectl apply -k k8s/

      - name: Update index.html ConfigMap
        run: |
          kubectl create configmap life-web-nginx-conf \
            --from-file=index.html=index.html \
            -n life \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Roll out life-web deployment
        run: |
          kubectl rollout restart deployment/life-web -n life
          kubectl rollout status deployment/life-web -n life --timeout=120s