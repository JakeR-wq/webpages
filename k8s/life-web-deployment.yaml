apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-web
  namespace: life
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-web
  template:
    metadata:
      labels:
        app: life-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: life-web-nginx-conf